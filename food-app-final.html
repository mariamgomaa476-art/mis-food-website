<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🍕 MIS Food</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 20px;
        }
        .nav {
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-title { font-size: 24px; font-weight: bold; color: #ff6b6b; }
        .nav-buttons { display: flex; gap: 10px; }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover { background: #764ba2; }
        .btn-logout { background: #ff6b6b; }
        .btn-logout:hover { background: #ee5a52; }
        .user { color: #ffd700; font-weight: bold; }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .page { display: none; }
        .page.show { display: block; }
        h1 { color: #667eea; text-align: center; margin-bottom: 25px; }
        .form {
            max-width: 400px;
            margin: 0 auto;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover { background: #764ba2; }
        .msg {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .msg.success { background: #d4edda; color: #155724; }
        .msg.error { background: #f8d7da; color: #721c24; }
        .foods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .food {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            padding: 20px;
            border-radius: 10px;
        }
        .food h3 { color: #667eea; margin-bottom: 8px; }
        .food p { color: #666; font-size: 14px; margin-bottom: 10px; }
        .price { color: #ff6b6b; font-weight: bold; font-size: 18px; margin: 10px 0; }
        .food input { margin-bottom: 8px; }
        .food .btn-submit { background: #ff6b6b; }
        .food .btn-submit:hover { background: #ee5a52; }
        .test-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #0066cc;
        }
        .test-info strong { color: #0066cc; }
        .link { color: #667eea; cursor: pointer; text-decoration: underline; font-weight: bold; }
        .center { text-align: center; color: #666; margin-top: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="nav-title">🍕 MIS FOOD</div>
        <div class="nav-buttons">
            <button class="btn" onclick="page('home')">HOME</button>
            <button class="btn" id="menuBtn" class="hidden" onclick="page('menu')">MENU</button>
            <span class="user hidden" id="userSpan"></span>
            <button class="btn btn-logout hidden" id="logoutBtn" onclick="logout()">LOGOUT</button>
            <button class="btn" id="loginBtn" onclick="page('login')">LOGIN</button>
            <button class="btn" id="signupBtn" onclick="page('signup')">SIGN UP</button>
        </div>
    </div>

    <div class="container">
        <!-- HOME -->
        <div class="page show" id="home">
            <h1>Welcome to MIS Food 🍕</h1>
            <p style="text-align: center; font-size: 18px; color: #666; margin-bottom: 30px;">
                Order delicious food online!
            </p>
            <div style="text-align: center;">
                <button class="btn-submit" onclick="page('menu')">View Menu</button>
            </div>
        </div>

        <!-- SIGNUP -->
        <div class="page" id="signup">
            <div class="form">
                <h1>Create Account</h1>
                <div id="msgSignup" class="msg hidden"></div>
                <input type="text" id="newUser" placeholder="Username">
                <input type="email" id="newEmail" placeholder="Email">
                <input type="password" id="newPass" placeholder="Password">
                <button class="btn-submit" onclick="signup()">Sign Up</button>
                <p class="center">Have account? <span class="link" onclick="page('login')">Login</span></p>
            </div>
        </div>

        <!-- LOGIN -->
        <div class="page" id="login">
            <div class="form">
                <h1>Login</h1>
                <div class="test-info">
                    <strong>🔓 Test:</strong><br>
                    Email: <strong>test@test.com</strong><br>
                    Pass: <strong>123456</strong>
                </div>
                <div id="msgLogin" class="msg hidden"></div>
                <input type="email" id="email" placeholder="test@test.com">
                <input type="password" id="pass" placeholder="123456">
                <button class="btn-submit" onclick="login()">Login</button>
                <p class="center">No account? <span class="link" onclick="page('signup')">Create</span></p>
            </div>
        </div>

        <!-- MENU -->
        <div class="page" id="menu">
            <h1>Food Menu</h1>
            <div id="msgMenu" class="msg hidden"></div>
            <div class="foods" id="foodList"></div>
        </div>
    </div>

    <script>
        // USERS DATABASE
        const users = [
            {id: 1, username: 'Test', email: 'test@test.com', password: '123456'}
        ];

        // FOODS DATABASE
        const foods = [
            {id: 1, name: 'Margherita Pizza', desc: 'Mozzarella & tomato', price: 120},
            {id: 2, name: 'Beef Burger', desc: 'Grilled beef with cheese', price: 150},
            {id: 3, name: 'Pasta', desc: 'Creamy pasta', price: 110},
            {id: 4, name: 'Chicken Sandwich', desc: 'Grilled chicken', price: 100},
            {id: 5, name: 'Greek Salad', desc: 'Fresh veggies', price: 90}
        ];

        let loggedInUser = null;

        function page(p) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('show'));
            document.getElementById(p).classList.add('show');
            
            if (p === 'menu' && !loggedInUser) {
                showMsg('msgLogin', 'Login first!', 'error');
                setTimeout(() => page('login'), 1000);
                return;
            }
            
            if (p === 'menu') {
                loadFoods();
            }
        }

        function login() {
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('pass').value.trim();
            
            if (!e || !p) {
                showMsg('msgLogin', 'Enter email & password', 'error');
                return;
            }
            
            const user = users.find(u => u.email === e && u.password === p);
            
            if (user) {
                loggedInUser = user;
                updateNav();
                showMsg('msgLogin', 'Login OK!', 'success');
                document.getElementById('email').value = '';
                document.getElementById('pass').value = '';
                setTimeout(() => page('home'), 1500);
            } else {
                showMsg('msgLogin', 'Wrong email or password!', 'error');
            }
        }

        function signup() {
            const name = document.getElementById('newUser').value.trim();
            const e = document.getElementById('newEmail').value.trim();
            const p = document.getElementById('newPass').value.trim();
            
            if (!name || !e || !p) {
                showMsg('msgSignup', 'Fill all fields!', 'error');
                return;
            }
            
            if (users.find(u => u.email === e)) {
                showMsg('msgSignup', 'Email exists!', 'error');
                return;
            }
            
            users.push({id: Date.now(), username: name, email: e, password: p});
            showMsg('msgSignup', 'Account created! Login now.', 'success');
            document.getElementById('newUser').value = '';
            document.getElementById('newEmail').value = '';
            document.getElementById('newPass').value = '';
            setTimeout(() => page('login'), 1500);
        }

        function logout() {
            loggedInUser = null;
            updateNav();
            page('home');
        }

        function updateNav() {
            if (loggedInUser) {
                document.getElementById('menuBtn').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('userSpan').classList.remove('hidden');
                document.getElementById('userSpan').textContent = 'Hi, ' + loggedInUser.username;
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('signupBtn').classList.add('hidden');
            } else {
                document.getElementById('menuBtn').classList.add('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('userSpan').classList.add('hidden');
                document.getElementById('loginBtn').classList.remove('hidden');
                document.getElementById('signupBtn').classList.remove('hidden');
            }
        }

        function loadFoods() {
            const list = document.getElementById('foodList');
            list.innerHTML = foods.map(f => `
                <div class="food">
                    <h3>${f.name}</h3>
                    <p>${f.desc}</p>
                    <div class="price">$${f.price}</div>
                    <input type="number" value="1" min="1" id="qty${f.id}">
                    <button class="btn-submit" onclick="order('${f.name}', ${f.price})">
                        Add Order
                    </button>
                </div>
            `).join('');
        }

        function order(name, price) {
            showMsg('msgMenu', `✅ ${name} added!`, 'success');
        }

        function showMsg(id, text, type) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg ' + type;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        updateNav();
    </script>
</body>
</html>
